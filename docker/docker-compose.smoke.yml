# Ambiente de smoke ponta a ponta: as IMAGENS de produção do Codex conversando entre si, com
# Postgres e Keycloak reais. É o que a suíte de testes não cobre — divergência de contrato entre
# cliente e servidor só aparece quando os dois se falam (dívida aberta desde a demanda 003).
#
# Rode de dentro de `codex-backend/`:
#   docker compose -p codex-smoke -f docker/docker-compose.smoke.yml up -d
#
# `-p codex-smoke` é obrigatório: dá projeto e volume próprios, e mantém o `pgdata` do
# desenvolvimento intocado. Derrubar com `-v` apaga só o volume deste ambiente:
#   docker compose -p codex-smoke -f docker/docker-compose.smoke.yml down -v
#
# As portas do host repetem as do desenvolvimento de propósito (5000 para a API, 5173 para o
# portal, 8080 para o Keycloak): é o que o realm importado já espera em `redirectUris`, e o que o
# `.env` do frontend já aponta. Trocar qualquer uma quebra o login sem avisar.
#
# ATENÇÃO: `IP_DO_HOST` é obrigatório, e precisa ser o IP da máquina na rede — nunca `localhost`:
#
#   SMOKE_SENHA=<senha-forte> IP_DO_HOST=192.168.1.2 docker compose -p codex-smoke -f docker/docker-compose.smoke.yml up -d
#
# O porquê, que custou a maior parte do tempo do primeiro smoke: o Keycloak anuncia no documento
# de descoberta um `issuer` E um `jwks_uri` montados a partir de `KC_HOSTNAME`. A API precisa
# baixar as chaves de assinatura DESSE `jwks_uri`. Com `localhost`, o navegador acha o Keycloak e
# a API acha a si mesma, nunca as chaves. O efeito é `401` em toda rota interna, sem pista no
# `WWW-Authenticate` (o `error_description` só sai em Development), e o problema é rede. Apontar só o `MetadataAddress` para o endereço interno NÃO resolve: o
# `jwks_uri` continua vindo público. O endereço precisa ser o mesmo, e alcançável, dos dois lados.
#
# `SMOKE_SENHA` também é obrigatório: é a senha do superusuário do banco, do `codex_user` e do
# admin do Keycloak. Sem `;` nem aspas, porque ela entra na connection string da API. Banco, API e
# portal escutam só em 127.0.0.1; o Keycloak escuta no IP da rede por desenho (ver acima), então a
# senha é a defesa que sobra contra quem está na mesma rede.

name: codex-smoke

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SMOKE_SENHA:?defina SMOKE_SENHA}
      POSTGRES_DB: codex_db
      CODEX_APP_DB_PASSWORD: ${SMOKE_SENHA:?defina SMOKE_SENHA}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata-smoke:/var/lib/postgresql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d codex_db']
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SMOKE_SENHA:?defina SMOKE_SENHA}
      # O `issuer` e o `jwks_uri` do documento de descoberta saem DESTE endereço. Ele precisa ser
      # alcançável pelo navegador E pela API: com `localhost`, cada um resolve para um lugar
      # diferente e a API nunca baixa as chaves de assinatura — 401 em tudo (ver cabeçalho).
      KC_HOSTNAME: 'http://${IP_DO_HOST}:8080'
    # Em todas as interfaces de propósito: a API, de dentro do container, chega pelo IP do host.
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-codex.json:/opt/keycloak/data/import/realm-codex.json

  api:
    image: codex-backend:smoke
    # Resolve o nome do host a partir de dentro do container (Docker Desktop provê; no Linux, o
    # mapeamento explícito abaixo cobre).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      # `db` é o nome do serviço na rede do compose — de dentro do container, `localhost` seria o
      # próprio container da API.
      ConnectionStrings__Default: 'Host=db;Port=5432;Database=codex_db;Username=codex_user;Password=${SMOKE_SENHA:?defina SMOKE_SENHA}'
      # O MESMO endereço que o navegador usa — é o issuer que vem no token e a origem das chaves.
      Keycloak__auth-server-url: 'http://${IP_DO_HOST}:8080'
      Keycloak__realm: codex
      Keycloak__resource: codex-backend
      Keycloak__ValidAudiences__0: codex-backend
      # O Keycloak do smoke fala HTTP na rede interna do compose — dispensa DECLARADA, que é o
      # que a validação de partida exige. Sem ela a aplicação recusa subir, de propósito.
      Keycloak__RequireHttpsMetadata: 'false'
      Cors__OrigemPermitida: 'http://localhost:5173'
      AllowedHosts: 'localhost;127.0.0.1;[::1];api'
      Busca__LimiarAutocorrecao: '0.45'
      Busca__TimeoutMs: '2000'
    ports:
      - '127.0.0.1:5000:8080'

  portal:
    image: codex-frontend:smoke
    depends_on:
      - api
    environment:
      # O navegador é quem faz as chamadas, então estas origens são as do HOST, não as da rede
      # interna do compose.
      CSP_CONNECT_SRC: 'http://localhost:5000 http://${IP_DO_HOST}:8080'
      # Origem do Keycloak: o keycloak-js mantém um iframe oculto para saber se a sessão ainda
      # vive. Sem esta diretiva a CSP bloqueia o iframe e o logout feito em outra aba não é visto.
      CSP_FRAME_SRC: 'http://${IP_DO_HOST}:8080'
    ports:
      - '127.0.0.1:5173:8080'

volumes:
  pgdata-smoke:
