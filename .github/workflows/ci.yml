name: CI

# O gate do backend só existia na máquina do desenvolvedor. Aqui ele roda a cada push e em toda
# proposta de merge, para que "a suíte passa" pare de ser uma afirmação sobre uma máquina só.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push seguido de push cancela o run anterior: o que importa é o estado do topo da branch, e dois
# runs da mesma branch disputando o mesmo Docker só gastam minuto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    # `ubuntu-latest` traz Docker no runner, que é requisito dos testes de integração: a suíte usa
    # Testcontainers e sobe um Postgres real. Sem Docker, dezenas de testes caem por ambiente, não
    # por defeito — e um vermelho de ambiente é pior que nenhum sinal.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore src/Codex.API/Codex.API.csproj

      # `--no-incremental` porque incremental reaproveita saída de build anterior e pode esconder
      # um erro que só aparece do zero — que é exatamente o caso que o CI existe para pegar.
      - name: Compilar
        run: dotnet build --no-incremental --configuration Release

      - name: Testes
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      # O comando sai 0 mesmo quando acha vulnerabilidade: quem decide é a contagem no JSON. Um
      # pacote só aparece na lista quando tem vulnerabilidade conhecida.
      - name: Dependências sem vulnerabilidade conhecida
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulneraveis.json
          jq -e '[.projects[].frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?)] | length == 0' vulneraveis.json \
            || { jq '.projects[].frameworks[]?' vulneraveis.json; exit 1; }

  imagem:
    # A imagem nunca era construída fora da máquina de quem fazia o smoke. Construir aqui pega
    # Dockerfile quebrado antes do deploy, que é onde ele custaria mais.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem da API
        run: docker build -t codex-backend:ci .
