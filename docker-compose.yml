services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CODEX_APP_DB_PASSWORD: ${CODEX_APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Duas coisas mudaram aqui, e as duas impediam o ambiente local de existir:
      #
      # 1. O caminho. A imagem 18 guarda os dados numa subpasta por versão maior e trata um volume
      #    montado direto em `/var/lib/postgresql/data` como "unused mount/volume": o container sai
      #    com erro na primeira subida e nunca cria o banco.
      #
      # 2. O nome do volume. O `pgdata` antigo contém um cluster PostgreSQL **17** que não sobe sob
      #    a imagem 18 nem no caminho novo, e que não pertence a este projeto (não tem sequer o
      #    role `postgres` que o `.env` configura). Ele foi PRESERVADO, e não apagado — se não
      #    tiver utilidade, `docker volume rm codex-backend_pgdata` o remove.
      - pgdata18:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-codex.json:/opt/keycloak/data/import/realm-codex.json

volumes:
  pgdata18:
