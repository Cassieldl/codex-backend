services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CODEX_APP_DB_PASSWORD: ${CODEX_APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # `/var/lib/postgresql`, NÃO `/var/lib/postgresql/data`: a imagem 18 guarda os dados numa
      # subpasta por versão maior e trata um volume montado direto em `data` como "unused
      # mount/volume" — o container sai com erro na primeira subida e nunca cria o banco. Era o
      # que impedia o ambiente local de existir, e o diagnóstico registrado ("volume de versão
      # anterior") apontava para o lugar errado: o volume estava vazio, o caminho é que mudou.
      - pgdata:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-codex.json:/opt/keycloak/data/import/realm-codex.json

volumes:
  pgdata:
